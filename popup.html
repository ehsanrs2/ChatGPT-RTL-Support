<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT RTL Support</title>
  <link rel="stylesheet" href="./popup.css">
  <link rel="stylesheet" href="./popup-v161.css">
</head>
<body>
  <div class="popup">
    <div>
      <a href="https://zaya.io/f89a0" target="_blank" rel="noopener noreferrer" class="coffee"><p>Buy Me a Coffee ☕️</p></a>
      <h1>ChatGPT <span class="eye">🤖</span> RTL Support</h1>
      <p class="messageAlert" role="status"></p>
      <button class="button" type="button" role="switch" aria-checked="false" aria-label="Enable RTL">
        <span class="half" style="left: 0;">On</span>
        <span class="half" style="right: 0;">Off</span>
        <span class="circle"></span>
      </button>
      <div class="font-setting">
        <label for="font-choice">Font / فونت</label>
        <select id="font-choice" aria-label="ChatGPT Persian font">
          <option value="default">Default (ChatGPT)</option>
          <option value="b-nazanin">B Nazanin (installed locally)</option>
        </select>
        <small>B Nazanin must be installed on your computer.</small>
        <label for="font-size">Font size / اندازه فونت: <output id="font-size-value" for="font-size">Default</output></label>
        <input type="range" id="font-size" min="12" max="28" step="1" value="16" aria-label="Font size" list="font-size-marks">
        <datalist id="font-size-marks"><option value="12"></option><option value="16"></option><option value="20"></option><option value="24"></option><option value="28"></option></datalist>
        <label for="latin-ratio">English / Latin ratio: <output id="latin-ratio-value" for="latin-ratio">85%</output></label>
        <input type="range" id="latin-ratio" min="70" max="100" step="1" value="85" aria-label="English font size as percentage of Persian font size">
        <small>When B Nazanin is selected, Latin letters use this ratio. Example: 20 px Persian → 17 px English.</small>
        <button type="button" id="font-size-reset" class="font-size-reset">Reset to default size</button>
        <small>Default or 12–28 px. Only RTL conversation text changes.</small>
      </div>
    </div>
    <div><img src="./assets/img/popup-optimized.webp" alt="RTL illustration" class="image"></div>
  </div>
  <div class="links">
    <a href="https://rastegar.info/chatgpt-rtl-support/" target="_blank" rel="noopener noreferrer">About</a>
    <a href="https://rastegar.info/chatgpt-rtl-support/#privacy" target="_blank" rel="noopener noreferrer">Privacy policy</a>
    <a href="https://github.com/ehsanrs2/ChatGPT-RTL-Support" target="_blank" rel="noopener noreferrer">Source code</a>
    <a href="https://github.com/inforastegar/ChatGPT-RTL-Support/issues" target="_blank" rel="noopener noreferrer">Report issue</a>
  </div>
  <script src="./popup.js"></script>
</body>
</html>
